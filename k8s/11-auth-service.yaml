apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: tw5-demo
  labels: { app: auth-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: auth-service }
  template:
    metadata:
      labels: { app: auth-service }
    spec:
      containers:
        - name: auth-service
          image: auth-service:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          env:
            - name: PORT
              value: "8080"
            - name: DB_HOST
              value: "auth-db.tw5-demo.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: auth-db-secret, key: DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: auth-db-secret, key: DB_PASSWORD } }
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: auth-db-secret, key: DB_NAME } }
          resources:
            # Requests are required -- HPA's CPU-utilization target is a
            # percentage of the request, so without one the HPA can't compute
            # a percentage at all.
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: tw5-demo
spec:
  selector: { app: auth-service }
  ports: [{ port: 8080, targetPort: 8080 }]
