apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-service
  namespace: tw5-demo
  labels: { app: hr-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: hr-service }
  template:
    metadata:
      labels: { app: hr-service }
    spec:
      containers:
        - name: hr-service
          image: hr-service:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          env:
            - name: PORT
              value: "8080"
            - name: DB_HOST
              value: "hr-db.tw5-demo.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: hr-db-secret, key: DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: hr-db-secret, key: DB_PASSWORD } }
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: hr-db-secret, key: DB_NAME } }
            - name: AUTH_SERVICE_URL
              value: "http://auth-service.tw5-demo.svc.cluster.local:8080/auth"
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: hr-service
  namespace: tw5-demo
spec:
  selector: { app: hr-service }
  ports: [{ port: 8080, targetPort: 8080 }]
