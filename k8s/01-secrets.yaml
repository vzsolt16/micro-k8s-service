# Sensitive values (DB users/passwords/db-names) live in Secrets, and are
# injected into pods purely via env vars (secretKeyRef) -- never baked into
# images or plain ConfigMaps.
apiVersion: v1
kind: Secret
metadata:
  name: auth-db-secret
  namespace: tw5-demo
type: Opaque
stringData:
  DB_USER: auth_user
  DB_PASSWORD: auth_pass_change_me
  DB_NAME: auth_db
---
apiVersion: v1
kind: Secret
metadata:
  name: storage-db-secret
  namespace: tw5-demo
type: Opaque
stringData:
  DB_USER: storage_user
  DB_PASSWORD: storage_pass_change_me
  DB_NAME: storage_db
---
apiVersion: v1
kind: Secret
metadata:
  name: hr-db-secret
  namespace: tw5-demo
type: Opaque
stringData:
  DB_USER: hr_user
  DB_PASSWORD: hr_pass_change_me
  DB_NAME: hr_db
