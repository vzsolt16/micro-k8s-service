apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-db
  namespace: tw5-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: hr-db }
  template:
    metadata:
      labels: { app: hr-db }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: hr-db-secret, key: DB_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: hr-db-secret, key: DB_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: hr-db-secret, key: DB_NAME } }
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "$(POSTGRES_USER)"] }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: pgdata
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: hr-db
  namespace: tw5-demo
spec:
  selector: { app: hr-db }
  ports: [{ port: 5432, targetPort: 5432 }]
